# On every push and pull request: the unit tests, the client build, and the short 64-player load test.
# On a push to main that passes, the built page is published to the gh-pages branch, which GitHub Pages serves at
# https://malachi-nelson.github.io/CowboyOnline/
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Load test, 64 players, 20 seconds a scenario
        run: node tools/loadtest/run.mjs --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-load-report
          path: |
            client/dist/index.html
            tools/loadtest/out/quick.json

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-page
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Put the built page on the gh-pages branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd client/dist
          rm -f artifact.html
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
