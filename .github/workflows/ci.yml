# On every push and pull request: the unit tests, the client build, and the short 64-player load test.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Load test, 64 players, 20 seconds a scenario
        run: node tools/loadtest/run.mjs --quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-and-load-report
          path: |
            client/dist/index.html
            tools/loadtest/out/quick.json
