# Publishes the game page to GitHub Pages. Run by hand (Actions > pages > Run workflow) once the repository's
# Pages source is set to "GitHub Actions".
#
# Do not enable this in the HoodWar repository: a repository has one Pages site, and this would replace
# HoodWar's. It is meant for a repository of the game's own.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: rm client/dist/artifact.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - id: deploy
        uses: actions/deploy-pages@v4
